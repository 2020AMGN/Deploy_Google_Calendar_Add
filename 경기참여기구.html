<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일정 구글 캘린더에 추가하기-1V2</title>
    <style>
        @font-face {
            font-family: 'RIDIBatang';
            src: url('https://raw.githubusercontent.com/2020AMGN/gonafont/main/font/RIDIBatang.otf') format('opentype');
            font-weight: 400;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'RIDIBatang', serif;
            background-color: #ffffff;
            color: #3a3a3a;
        }

        .card {
            background-color: #fafafa;
            border: 2px solid #666666;
        }

        .icon {
            stroke: #3a3a3a;
        }

        .section-title::before {
            background-color: #3a3a3a;
        }

        .bullet-point::before {
            background-color: #3a3a3a;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 30px;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .card {
            border-radius: 16px;
            padding: 30px;
            transition: transform 0.3s ease;
            display: flex;
            gap: 30px;
        }

        .card-left {
            flex: 1;
        }

        .card-right {
            flex: 0 0 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-left: 20px;
            border-left: 2px solid #666666;
        }

        .mini-calendar {
            width: 100%;
            text-align: center;
        }

        .calendar-info {
            font-size: 11px;
            color: #666666;
            margin-top: 12px;
            margin-bottom: 8px;
            line-height: 1.6;
            word-break: break-word;
        }

        .calendar-time {
            font-size: 14px;
            color: #3a3a3a;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .calendar-multi-month {
            font-size: 11px;
            color: #4285F4;
            font-weight: 600;
            margin-bottom: 8px;
            padding: 4px 8px;
            background-color: #e3f2fd;
            border-radius: 4px;
            text-align: center;
        }

        .calendar-header {
            font-size: 14px;
            font-weight: 600;
            color: #3a3a3a;
            margin-bottom: 12px;
        }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 8px;
        }

        .weekday {
            font-size: 12px;
            font-weight: 600;
            color: #999;
            padding: 4px 0;
        }

        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .calendar-day {
            font-size: 12px;
            padding: 6px 0;
            border-radius: 4px;
            color: #999;
        }

        .calendar-day.other-month {
            opacity: 0.3;
        }

        .calendar-day.today {
            background-color: #4285F4;
            color: #ffffff;
            font-weight: 600;
        }

        .calendar-day.event-date {
            background-color: #e8d5f2;
            color: #5a4a7a;
            font-weight: 600;
            border: 1px solid #b8a8d8;
        }

        .add-calendar-btn-right {
            background-color: transparent;
            border: 2px solid #4285F4;
            color: #4285F4;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'RIDIBatang', serif;
            font-size: 13px;
            font-weight: 500;
            margin-top: 12px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .add-calendar-btn-right:hover {
            background-color: #4285F4;
            color: #ffffff;
        }

        .add-calendar-btn-right:active {
            transform: scale(0.98);
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .section-title {
            display: flex;
            align-items: center;
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .section-title::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 12px;
        }

        .icon-group {
            display: flex;
            gap: 12px;
        }

        .icon {
            width: 24px;
            height: 24px;
            fill: none;
            stroke-width: 2;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .icon:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .card-content {
            margin-top: 20px;
        }

        .bullet-point {
            display: flex;
            align-items: flex-start;
            margin-bottom: 16px;
            font-size: 16px;
            line-height: 1.6;
        }

        .bullet-point::before {
            content: '';
            min-width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 12px;
            margin-top: 8px;
        }

        .time-display {
            font-size: 16px;
            font-weight: 400;
            margin-bottom: 12px;
        }

        .highlight-text {
            font-size: 18px;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .footer-card {
            background: linear-gradient(135deg, #e8d5f2 0%, #d9c9e8 100%);
            border: 2px solid #b8a8d8;
            border-radius: 16px;
            padding: 20px 30px;
            text-align: center;
            margin-top: 40px;
        }

        .footer-card p {
            font-size: 14px;
            color: #5a4a7a;
            margin: 0;
            font-weight: 400;
        }

        .footer-card a {
            color: #5a4a7a;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .footer-card a:hover {
            color: #3a2a5a;
            text-decoration: underline;
        }

        /* 모바일 디바이스 표시 배지 */
        .device-badge {
            position: fixed;
            top: 10px;
            right: 10px;
            background-color: rgba(66, 133, 244, 0.9);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            z-index: 1000;
            display: none;
        }

        .device-badge.mobile {
            display: block;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 32px;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }

            .header-main {
                font-size: 18px;
            }

            .header-link {
                font-size: 16px;
            }

            .creator-info {
                font-size: 14px;
            }

            .card {
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }

            .card-left {
                flex: 1;
            }

            .card-right {
                flex: 1;
                border-left: none;
                border-top: 2px solid #666666;
                padding-left: 0;
                padding-top: 20px;
            }

            .section-title {
                font-size: 20px;
            }

            .bullet-point {
                font-size: 14px;
            }

            .mini-calendar {
                width: 100%;
            }

            .calendar-header {
                font-size: 12px;
            }

            .calendar-weekdays {
                gap: 2px;
                margin-bottom: 6px;
            }

            .weekday {
                font-size: 10px;
                padding: 2px 0;
            }

            .calendar-days {
                gap: 2px;
            }

            .calendar-day {
                font-size: 10px;
                padding: 4px 0;
            }

            .calendar-info {
                font-size: 10px;
                margin-top: 10px;
                margin-bottom: 6px;
            }

            .calendar-time {
                font-size: 12px;
                margin-bottom: 10px;
            }

            .add-calendar-btn-right {
                padding: 10px 20px;
                font-size: 12px;
                margin-top: 12px;
                width: 100%;
            }

            .container {
                padding: 20px 15px;
            }

            .header {
                margin-bottom: 30px;
            }

            .cards-grid {
                gap: 20px;
            }

            .footer-card {
                padding: 15px 20px;
                margin-top: 30px;
            }

            .footer-card p {
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 24px;
                margin-bottom: 20px;
            }

            .card {
                padding: 16px;
                gap: 16px;
            }

            .card-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .section-title {
                font-size: 18px;
            }

            .icon-group {
                width: 100%;
                justify-content: flex-start;
            }

            .icon {
                width: 20px;
                height: 20px;
            }

            .bullet-point {
                font-size: 13px;
                margin-bottom: 12px;
            }

            .card-content {
                margin-top: 12px;
            }

            .calendar-header {
                font-size: 11px;
            }

            .weekday {
                font-size: 9px;
            }

            .calendar-day {
                font-size: 9px;
                padding: 3px 0;
            }

            .calendar-info {
                font-size: 9px;
                margin-top: 8px;
                margin-bottom: 4px;
            }

            .calendar-time {
                font-size: 11px;
                margin-bottom: 8px;
            }

            .calendar-multi-month {
                font-size: 10px;
                padding: 3px 6px;
                margin-bottom: 6px;
            }

            .add-calendar-btn-right {
                padding: 8px 16px;
                font-size: 11px;
                margin-top: 10px;
            }

            .container {
                padding: 16px 12px;
            }

            .header {
                margin-bottom: 24px;
            }

            .cards-grid {
                gap: 16px;
            }

            .footer-card {
                padding: 12px 16px;
            }

            .footer-card p {
                font-size: 11px;
            }

            .footer-card a {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <!-- 디바이스 표시 배지 (개발 확인용, 필요시 제거 가능) -->
    <div class="device-badge" id="deviceBadge">📱 모바일</div>

    <div class="container">
        <div class="header">
            <h1>📅 일정 구글 캘린더에 추가하기-1V2</h1>
        </div>

        <div class="cards-grid" id="eventList"></div>

        <!-- 하단 제작자 정보 카드 -->
        <div class="footer-card">
            <p>
                ✨ 당신의 인생을 바꿀 AI 서비스 
                🚀 <a href="https://PCBPLAY.COM" target="_blank">PCBPLAY.COM</a>
                | 제작자 <a href="https://instagram.com/makergona" target="_blank">@makergona</a>
            </p>
        </div>
    </div>

    <script>
    // 마크다운 데이터
    const addCalnderData = `
### 2025년 경기도 인구포럼 다시 세우는 인구미래
제목 : 2025년 경기도 인구포럼 다시 세우는 인구미래
날짜 : 2025-10-31
시작-시간 : 2025-10-31T14:00:00
끝-시간 : 2025-10-31T16:10:00
참석자 : 도민, 전문가, 기업 등 100여명
위치 : 노보텔엠버서더 수원 2층, 대한민국 경기도 수원시
설명 : 토론주제: '다시 세우는 인구미래' 일상 속 변화로 시작하다 / 인센티브: 수당 6만원 지급(참석+설문조사 시) / 문의처: 경기도 인구정챔담당관실(031-8008-4116)


### 수원 화성 플로깅
제목 : 수원 화성 플로깅 (사회공헌활동)
날짜 : 2025-11-08
시작-시간 : 2025-11-08T13:00:00
끝-시간 : 2025-11-08T15:00:00
참석자 : 
위치 : 수원 화성 장안공원 일대, 대한민국 경기도 수원시
설명 : 사회공헌활동 - 환경정화 플로깅


### 경기도 청년참여기구 5기 토론회
제목 : 경기도 청년참여기구 5기 토론회
날짜 : 2025-11-20
시작-시간 : 2025-11-20T13:00:00
끝-시간 : 2025-11-20T15:00:00
참석자 : 
위치 : 수원컨벤션센터, 대한민국 경기도 수원시
설명 : "경기도 청년참여기구 활동 사례분석을 통한 활성화 방안" 토론회
`;

    // 마크다운 파싱 함수
    function parseMarkdown(markdown) {
        const events = [];
        const eventBlocks = markdown.split('###').filter(block => block.trim());

        eventBlocks.forEach(block => {
            const lines = block.trim().split('\n');
            const event = {};

            lines.forEach(line => {
                if (!line.includes(':')) return;

                const colonIndex = line.indexOf(':');
                const key = line.substring(0, colonIndex).trim();
                const value = line.substring(colonIndex + 1).trim();

                if (key === '제목') event.title = value;
                if (key === '날짜') event.date = value;
                if (key === '시작-시간') event.startTime = value;
                if (key === '끝-시간') event.endTime = value;
                if (key === '날짜') event.startDate = value;  // '날짜' 필드도 startDate로 처리
                if (key === '시작-날짜') event.startDate = value;
                if (key === '끝-날짜') event.endDate = value;
                if (key === '참석자') event.attendees = value;
                if (key === '위치') event.location = value;
                if (key === '설명') event.description = value;
            });

            // 필수 필드 체크 - 시간 기반 또는 날짜 기반
            const hasTimeInfo = event.startTime && event.endTime;
            const hasDateInfo = event.startDate && event.endDate;
            
            if (event.title && (hasTimeInfo || hasDateInfo)) {
                events.push(event);
                console.log('파싱된 이벤트:', event);
            } else {
                console.warn('불완전한 이벤트 데이터:', event);
            }
        });

        return events;
    }

    // 이벤트 정보를 HTML로 렌더링하는 함수
    function renderEvents(events) {
        const eventList = document.getElementById('eventList');
        eventList.innerHTML = '';

        events.forEach((event, index) => {
            // 날짜/시간 정보 확인
            const isDateOnly = event.startDate && event.endDate;
            const isTimeInfo = event.startTime && event.endTime;

            if (!isDateOnly && !isTimeInfo) {
                console.error('날짜 또는 시간 정보 누락:', event);
                return;
            }

            let startDate, endDate, timeDisplay;

            if (isDateOnly) {
                // 날짜만 있는 경우
                startDate = event.startDate;
                endDate = event.endDate;
                timeDisplay = '종일';
            } else {
                // 시간이 있는 경우
                startDate = event.startTime.split('T')[0];
                endDate = event.endTime.split('T')[0];
                const isAllDay = event.startTime.length === 10;
                timeDisplay = isAllDay ? '종일' :
                    `${event.startTime.split('T')[1].slice(0, 5)} ~ ${event.endTime.split('T')[1].slice(0, 5)}`;
            }

            const eventItem = document.createElement('div');
            eventItem.className = 'card';

            // 날짜 포맷팅
            const dateObj = new Date(startDate + 'T00:00:00');
            const formattedDate = dateObj.toLocaleDateString('ko-KR', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            // 종료 날짜 포맷팅
            let dateRangeDisplay = formattedDate;
            if (startDate !== endDate) {
                const endDateObj = new Date(endDate + 'T00:00:00');
                const formattedEndDate = endDateObj.toLocaleDateString('ko-KR', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
                dateRangeDisplay = `${formattedDate} ~ ${formattedEndDate}`;
            }

            // 고유한 ID 생성 (인덱스 포함)
            const calendarId = `calendar-${startDate}-${index}`;

            eventItem.innerHTML = `
                <div class="card-left">
                    <div class="card-header">
                        <div class="section-title">${event.title}</div>
                        <div class="icon-group">
                            <svg class="icon" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="10"/>
                                <path d="M12 6v6l4 2"/>
                            </svg>
                            <svg class="icon" viewBox="0 0 24 24">
                                <polyline points="18 15 12 9 6 15"/>
                            </svg>
                        </div>
                    </div>
                    <div class="card-content">
                        <div class="bullet-point">📍 ${event.location || '위치 미정'}</div>
                        <div class="bullet-point">👥 ${event.attendees || '참석자 미정'}</div>
                        <div class="bullet-point">📝 ${event.description || '설명 없음'}</div>
                    </div>
                </div>
                <div class="card-right">
                    <div class="mini-calendar" id="${calendarId}"></div>
                    <button class="add-calendar-btn-right"
                        data-event-title="${event.title}"
                        data-event-start="${isTimeInfo ? event.startTime : startDate}"
                        data-event-end="${isTimeInfo ? event.endTime : endDate}"
                        data-event-is-date-only="${isDateOnly}"
                        data-event-location="${event.location || ''}"
                        data-event-description="${event.description || ''}">
                        📅 캘린더 추가
                    </button>
                </div>
            `;

            eventList.appendChild(eventItem);

            // DOM 요소가 추가된 후 달력 그리기
            setTimeout(() => {
                generateMiniCalendar(calendarId, startDate, endDate, dateRangeDisplay, timeDisplay);
            }, 0);
        });
    }

    // 미니 달력 생성 함수 (calendarId 파라미터 추가)
    function generateMiniCalendar(calendarId, dateString, endDateString, dateRangeDisplay, timeDisplay) {
        // UTC 타임존 이슈 해결: Z를 추가하여 정확한 날짜 파싱
        const date = new Date(dateString + 'T00:00:00Z');
        const endDate = new Date(endDateString + 'T00:00:00Z');
        const year = date.getUTCFullYear();
        const month = date.getUTCMonth();
        const startDay = date.getUTCDate();
        const endDay = endDate.getUTCDate();

        // 달이 넘어가는지 확인
        const isMultiMonth = date.getUTCMonth() !== endDate.getUTCMonth() || date.getUTCFullYear() !== endDate.getUTCFullYear();

        let html = '';

        if (isMultiMonth) {
            // 시작 달
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            html += `<div class="calendar-header">${year}년 ${month + 1}월</div>`;
            html += `<div class="calendar-weekdays">
                <div class="weekday">일</div>
                <div class="weekday">월</div>
                <div class="weekday">화</div>
                <div class="weekday">수</div>
                <div class="weekday">목</div>
                <div class="weekday">금</div>
                <div class="weekday">토</div>
            </div>`;

            html += '<div class="calendar-days">';

            // 첫 주의 빈 칸
            for (let i = 0; i < firstDay; i++) {
                html += '<div class="calendar-day other-month"></div>';
            }

            // 날짜들
            for (let d = 1; d <= daysInMonth; d++) {
                let dayClass = 'calendar-day';
                // 시작일 이후의 날짜 표시
                if (d >= startDay) {
                    dayClass += ' event-date';
                }
                html += `<div class="${dayClass}">${d}</div>`;
            }

            html += '</div>';

            // 중간 달들
            let currentMonth = month + 1;
            let currentYear = year;
            
            while (currentYear < endDate.getUTCFullYear() || 
                   (currentYear === endDate.getUTCFullYear() && currentMonth < endDate.getUTCMonth())) {
                
                // 12월을 넘으면 다음 연도로 이동
                if (currentMonth > 11) {
                    currentMonth = 0;
                    currentYear++;
                }
                
                const currentFirstDay = new Date(currentYear, currentMonth, 1).getDay();
                const currentDaysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

                html += `<div class="calendar-header" style="margin-top: 12px;">${currentYear}년 ${currentMonth + 1}월</div>`;
                html += `<div class="calendar-weekdays">
                    <div class="weekday">일</div>
                    <div class="weekday">월</div>
                    <div class="weekday">화</div>
                    <div class="weekday">수</div>
                    <div class="weekday">목</div>
                    <div class="weekday">금</div>
                    <div class="weekday">토</div>
                </div>`;

                html += '<div class="calendar-days">';

                // 첫 주의 빈 칸
                for (let i = 0; i < currentFirstDay; i++) {
                    html += '<div class="calendar-day other-month"></div>';
                }

                // 날짜들 - 중간 달은 모두 표시
                for (let d = 1; d <= currentDaysInMonth; d++) {
                    html += `<div class="calendar-day event-date">${d}</div>`;
                }

                html += '</div>';
                currentMonth++;
            }

            // 끝나는 달
            const endFirstDay = new Date(endDate.getUTCFullYear(), endDate.getUTCMonth(), 1).getDay();
            const endDaysInMonth = new Date(endDate.getUTCFullYear(), endDate.getUTCMonth() + 1, 0).getDate();

            html += `<div class="calendar-header" style="margin-top: 12px;">${endDate.getUTCFullYear()}년 ${endDate.getUTCMonth() + 1}월</div>`;
            html += `<div class="calendar-weekdays">
                <div class="weekday">일</div>
                <div class="weekday">월</div>
                <div class="weekday">화</div>
                <div class="weekday">수</div>
                <div class="weekday">목</div>
                <div class="weekday">금</div>
                <div class="weekday">토</div>
            </div>`;

            html += '<div class="calendar-days">';

            // 첫 주의 빈 칸
            for (let i = 0; i < endFirstDay; i++) {
                html += '<div class="calendar-day other-month"></div>';
            }

            // 날짜들 - 끝나는 날짜까지만 표시
            for (let d = 1; d <= endDaysInMonth; d++) {
                let dayClass = 'calendar-day';
                if (d <= endDay) {
                    dayClass += ' event-date';
                }
                html += `<div class="${dayClass}">${d}</div>`;
            }

            html += '</div>';
            
            html += `<div class="calendar-multi-month">📍 ${endDate.getUTCMonth() + 1}월까지 진행</div>`;
        } else {
            // 단일 월
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            html += `<div class="calendar-header">${year}년 ${month + 1}월</div>`;
            html += `<div class="calendar-weekdays">
                <div class="weekday">일</div>
                <div class="weekday">월</div>
                <div class="weekday">화</div>
                <div class="weekday">수</div>
                <div class="weekday">목</div>
                <div class="weekday">금</div>
                <div class="weekday">토</div>
            </div>`;

            html += '<div class="calendar-days">';

            // 첫 주의 빈 칸
            for (let i = 0; i < firstDay; i++) {
                html += '<div class="calendar-day other-month"></div>';
            }

            // 날짜들
            for (let d = 1; d <= daysInMonth; d++) {
                let dayClass = 'calendar-day';
                // 시작일부터 끝나는 날짜까지만 표시
                if (d >= startDay && d <= endDay) {
                    dayClass += ' event-date';
                }
                html += `<div class="${dayClass}">${d}</div>`;
            }

            html += '</div>';
        }
        
        // 날짜 정보를 여러 줄로 분리해서 표시
        const dateInfo = dateRangeDisplay.replace(' ~ ', '<br>~ ');
        html += `<div class="calendar-info">${dateInfo}</div>`;
        html += `<div class="calendar-time">⏰ ${timeDisplay}</div>`;

        const calendarElement = document.getElementById(calendarId);
        if (!calendarElement) {
            console.error(`캘린더 요소를 찾을 수 없습니다: ${calendarId}`);
            console.log('가능한 ID들:', Array.from(document.querySelectorAll('[id*="calendar"]')).map(el => el.id));
            return;
        }
        calendarElement.innerHTML = html;
    }

    // 페이지 로드 시 실행
    window.onload = function() {
        // 모바일 기기 감지 표시
        detectDevice();
        
        const events = parseMarkdown(addCalnderData);
        renderEvents(events);

        const addCalendarButtons = document.querySelectorAll('.add-calendar-btn-right');
        addCalendarButtons.forEach(button => {
            button.addEventListener('click', handleAddCalendarClick);
        });
    };

    /**
     * 모바일/PC 기기 감지 함수
     */
    function detectDevice() {
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const badge = document.getElementById('deviceBadge');
        
        if (isMobile) {
            badge.classList.add('mobile');
            console.log('📱 모바일 기기 감지됨');
        } else {
            console.log('💻 PC 기기 감지됨');
        }
    }

    /**
     * '일정 추가' 버튼 클릭 시 실행되는 함수
     */
    function handleAddCalendarClick(event) {
        const button = event.currentTarget;
        const eventData = {
            title: button.dataset.eventTitle,
            startTime: button.dataset.eventStart,
            endTime: button.dataset.eventEnd,
            isDateOnly: button.dataset.eventIsDateOnly,
            location: button.dataset.eventLocation,
            details: button.dataset.eventDescription
        };

        openCalendarLink(eventData);
    }

    /**
     * 구글 캘린더 URL을 생성하여 새 탭으로 여는 함수 (모바일/PC 최적화)
     */
    function openCalendarLink(eventData) {
        const formatTimeForUrl = (datetime) => {
            if (!datetime) return '';
            if (datetime.length === 10) return datetime.replace(/-/g, '');
            return new Date(datetime).toISOString().replace(/[-:.]/g, '').slice(0, 15) + 'Z';
        };

        const isDateOnly = eventData.isDateOnly === 'true';
        let startTime, endDate;

        if (isDateOnly) {
            // 날짜만 있는 경우: YYYYMMDD 형식
            startTime = eventData.startTime.replace(/-/g, '');
            const endDateObj = new Date(eventData.endTime);
            endDateObj.setDate(endDateObj.getDate() + 1);
            endDate = endDateObj.toISOString().split('T')[0].replace(/-/g, '');
        } else {
            // 시간이 있는 경우
            if (eventData.startTime.length === 10 && eventData.endTime.length === 10) {
                startTime = eventData.startTime.replace(/-/g, '');
                const date = new Date(eventData.endTime);
                date.setDate(date.getDate() + 1);
                endDate = date.toISOString().split('T')[0].replace(/-/g, '');
            } else {
                startTime = formatTimeForUrl(eventData.startTime);
                endDate = formatTimeForUrl(eventData.endTime);
            }
        }

        // 모바일 기기 감지
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
        const isAndroid = /Android/.test(navigator.userAgent);

        if (isMobile) {
            console.log('📱 모바일 기기 감지됨');
            
            if (isIOS) {
                // iOS: 구글 캘린더 앱 딥링크 시도
                const iosDeepLink = `googlechrome://calendar.google.com/calendar/u/0/r/eventedit?text=${encodeURIComponent(eventData.title)}&dates=${startTime}/${endDate}&details=${encodeURIComponent(eventData.details || '')}&location=${encodeURIComponent(eventData.location || '')}&hl=ko`;
                const webUrl = `https://calendar.google.com/calendar/u/0/r/eventedit?text=${encodeURIComponent(eventData.title)}&dates=${startTime}/${endDate}&details=${encodeURIComponent(eventData.details || '')}&location=${encodeURIComponent(eventData.location || '')}&hl=ko`;
                
                console.log('🍎 iOS 구글 캘린더 앱 시도');
                
                // iOS 앱이 없으면 웹으로 폴백
                setTimeout(() => {
                    window.location.href = webUrl;
                }, 1000);
                
                // 앱 딥링크 시도
                window.location.href = iosDeepLink;
                
            } else if (isAndroid) {
                // Android: 구글 캘린더 앱 인텐트 (intent scheme)
                const androidDeepLink = `intent://calendar.google.com/calendar/u/0/r/eventedit?text=${encodeURIComponent(eventData.title)}&dates=${startTime}/${endDate}&details=${encodeURIComponent(eventData.details || '')}&location=${encodeURIComponent(eventData.location || '')}&hl=ko#Intent;scheme=https;package=com.google.android.calendar;action=android.intent.action.VIEW;end`;
                
                // 직접 앱 패키지 실행
                const packageIntent = `intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.google.android.calendar;end`;
                
                console.log('🤖 Android 구글 캘린더 앱 시도');
                
                // 1. 구글 캘린더 앱으로 직접 이벤트 추가 시도
                try {
                    window.location.href = androidDeepLink;
                } catch(e) {
                    console.log('딥링크 실패, 웹으로 연결');
                    const webUrl = `https://calendar.google.com/calendar/u/0/r/eventedit?text=${encodeURIComponent(eventData.title)}&dates=${startTime}/${endDate}&details=${encodeURIComponent(eventData.details || '')}&location=${encodeURIComponent(eventData.location || '')}&hl=ko`;
                    setTimeout(() => {
                        window.location.href = webUrl;
                    }, 500);
                }
            } else {
                // 기타 모바일: 웹 URL 사용
                const webUrl = `https://calendar.google.com/calendar/u/0/r/eventedit?text=${encodeURIComponent(eventData.title)}&dates=${startTime}/${endDate}&details=${encodeURIComponent(eventData.details || '')}&location=${encodeURIComponent(eventData.location || '')}&hl=ko`;
                window.open(webUrl, '_blank');
            }
        } else {
            // PC용 구글 캘린더 URL
            const calendarUrl = `https://www.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(eventData.title)}&dates=${startTime}/${endDate}&details=${encodeURIComponent(eventData.details || '')}&location=${encodeURIComponent(eventData.location || '')}&hl=ko`;
            
            console.log('💻 PC 캘린더 URL 오픈');
            window.open(calendarUrl, '_blank');
        }
    }

    // 아이콘 호버 효과
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.icon').forEach(icon => {
            icon.addEventListener('mouseenter', function() {
                this.style.transform = 'scale(1.1) rotate(5deg)';
            });
            icon.addEventListener('mouseleave', function() {
                this.style.transform = 'scale(1) rotate(0deg)';
            });
        });
    });
    </script>
</body>
</html>
